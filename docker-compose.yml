services:
  libras2text-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: libras2text-api:latest
    container_name: libras2text_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OMP_NUM_THREADS=4
      - ONNX_NUM_THREADS=4
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '3.0'
        reservations:
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3